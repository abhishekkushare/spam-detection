<div class="modal fade" id="loginModal" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header card-header-brand">
                <h5 class="modal-title">Sign In</h5>
                <button class="close text-white" type="button" data-dismiss="modal">&times;</button>
            </div>
            <div class="modal-body">
                <form method="post" action="{{ url_for('login') }}">
                    <div class="form-group">
                        <label for="modal_sid">Twilio Account SID</label>
                        <input type="text" class="form-control" id="modal_sid" name="s_id" placeholder="ACxxxxxxxx" required>
                    </div>
                    <div class="form-group">
                        <label for="modal_token">Auth Token</label>
                        <input type="text" class="form-control" id="modal_token" name="token" placeholder="Twilio auth token" required>
                    </div>
                    <div class="text-right">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-brand">Sign In</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
